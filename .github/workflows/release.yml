name: Windows release build
on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Download Godot 4.7.1 + export templates
        run: |
          curl -sL -o godot.zip https://github.com/godotengine/godot/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          unzip -q godot.zip && chmod +x Godot_v4.7.1-stable_linux.x86_64
          curl -sL -o templates.tpz https://github.com/godotengine/godot/releases/download/4.7.1-stable/Godot_v4.7.1-stable_export_templates.tpz
          mkdir -p ~/.local/share/godot/export_templates/4.7.1.stable
          unzip -q templates.tpz -d /tmp/tpl
          mv /tmp/tpl/templates/* ~/.local/share/godot/export_templates/4.7.1.stable/
      - name: Import assets
        run: ./Godot_v4.7.1-stable_linux.x86_64 --headless --path . --import || true
      - name: Export Windows build
        run: |
          mkdir -p build
          ./Godot_v4.7.1-stable_linux.x86_64 --headless --path . --export-release "Windows Desktop" build/Afterlight.exe
          ls -lh build/
      - name: Zip build
        run: cd build && zip -q Afterlight-windows-x86_64.zip Afterlight.exe
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Afterlight-windows-x86_64
          path: build/Afterlight-windows-x86_64.zip
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: build/Afterlight-windows-x86_64.zip
          generate_release_notes: true
