[plugin]

name="Vertex Studio"
description="Edit, manage and paint vertex colors and vertex normals of 3D meshes. A complete solution for dealing with vertices inside Godot. A must-have tool for making games inspired by PS1, N64 or early PC games aesthetics, but vertex coloring can also be used for modern texture blending and masking. Available in GDScript and C++."
author="Alfred Reinold Baudisch"
version="1.1.0-b55"
script="vertex_studio_plugin.gd"
